version: 2

rabbitmq: &rabbitmq
  image: rabbitmq:3-alpine

restore: &restore
  restore_cache:
    key: deps-{{ checksum "package-lock.json" }}

cache: &cache
  save_cache:
    key: deps-{{ checksum "package-lock.json" }}
    paths:
      - node_modules/

make: &make
  run:
    name: Install GNU Make
    command: apk add make --no-cache

git: &git
  run:
    name: Install Git and certificates
    command: apk add ca-certificates git --no-cache

wait: &wait
  run:
    name: Wait For RabbitMQ To Start
    command: until nc -z 127.0.0.1 5672; do sleep 1; done

test: &test
  steps:
    - checkout
    - *restore
    - *make
    - *git
    - run:
        name: Install Dependencies
        command: make deps
    - *cache
    - *wait
    - run:
        name: Run Tests
        command: make types test

jobs:
  lint:
    docker:
      - image: node:24-alpine
    steps:
      - checkout
      - *git
      - run:
          name: Install ESLint
          command: npm install --no-save eslint@^6.8.0
      - *make
      - run:
          name: Run ESLint
          command: make lint

  node20:
    docker:
      - image: node:20-alpine
      - *rabbitmq
    <<: *test

  node22:
    docker:
      - image: node:22-alpine
      - *rabbitmq
    <<: *test

  node24:
    docker:
      - image: node:24-alpine
      - *rabbitmq
    <<: *test

workflows:
  version: 2
  build:
    jobs:
      - lint
      - node20:
          requires:
            - lint
      - node22:
          requires:
            - lint
      - node24:
          requires:
            - lint
